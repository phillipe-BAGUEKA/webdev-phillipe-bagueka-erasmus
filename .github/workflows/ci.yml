# Lab booking: isolated tests and the same Python coverage gate used locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
          PGPORT: '5433'
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -U postgres -p 5433"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Dependency and Django checks (isolated settings)
        run: |
          python -m pip check
          python manage.py check --settings=tests.settings

      - name: Empty PostgreSQL migrations and restricted test role
        uses: ./.github/actions/postgres-test

      - name: Application, project MCP stdio/parity, concurrency, TP1 and JavaScript
        env:
          # Show exact executed AC titles, including the real project stdio tests.
          PYTEST_ADDOPTS: '-rA'
        run: npm test

      # From Exercise 4 on. An image that does not build is the most common reason a
      # deploy fails, and finding it here takes a minute instead of waiting for the
      # host to build it remotely and reading its log. Skipped until you write one.
      - name: Docker image builds
        if: hashFiles('Dockerfile') != ''
        run: docker build -t ci-check .

  # Service rules are Python, not JavaScript: enforce 100% lines AND branches there.
  # The Python global line gate is 80%, including TP1 subprocesses and all production
  # files in the existing inventory. Node coverage remains a separate frontend check.
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
          PGPORT: '5433'
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -U postgres -p 5433"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: JavaScript coverage (existing 80% line threshold)
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include='src/**' --test-coverage-exclude='tests/**' \
            --test-coverage-lines=80 tests/labs_ui.test.mjs tests/booking_ui.test.mjs tests/ai_suggestion_ui.test.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Empty PostgreSQL migrations and restricted test role
        uses: ./.github/actions/postgres-test

      - name: Python coverage (Django and TP1, blocking gates)
        run: python tools/check_coverage.py --postgresql

  # Keep the course's original MCP checker and the package.json launch command.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: MCP conformance
        run: node mcp-server/check.mjs -- npm run --silent mcp

  # The spec is a deliverable, so it is checked like one: it cannot quietly rot
  # while the code moves on. From Exercise 2 on.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: SPEC.md is still filled in
        run: node checks/ex2.mjs
